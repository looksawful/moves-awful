name: typescript-lock-refresh

on:
  push:
    branches: [feat/typescript-core-2026-09-16]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/typescript-core-2026-09-16

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "moves-awful automation"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for TypeScript"
          git push origin HEAD:feat/typescript-core-2026-09-16
