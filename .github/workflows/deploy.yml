name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character master commit SHA to publish
        required: true
        type: string
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy.yml

permissions:
  contents: write

concurrency:
  group: moves-awful-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_URL: https://looksawful.github.io/moves-awful/
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Select and verify source SHA
        id: source
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$DISPATCH_SHA"
          else
            SOURCE_SHA="$PUSH_SHA"
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character Git commit SHA" >&2
            exit 1
          fi

          git fetch origin master gh-pages --prune
          git rev-parse --verify "${SOURCE_SHA}^{commit}" >/dev/null
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          git checkout --detach "$SOURCE_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]; then
            echo "Exact source checkout mismatch: expected $SOURCE_SHA, got $ACTUAL_SHA" >&2
            exit 1
          fi

          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Repository checks
        run: npm run check

      - name: Behavioral tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Stage generated publication tree
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/moves-awful-pages"
          git worktree add "$PUBLISH_DIR" origin/gh-pages
          find "$PUBLISH_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. "$PUBLISH_DIR/"
          touch "$PUBLISH_DIR/.nojekyll"
          printf '%s\n' "$SOURCE_SHA" > "$PUBLISH_DIR/source-sha.txt"

          git -C "$PUBLISH_DIR" add -A
          if git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo "Publication tree already matches $SOURCE_SHA"
            exit 0
          fi

          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" commit -m "Deploy $SOURCE_SHA"
          git -C "$PUBLISH_DIR" push origin HEAD:gh-pages

      - name: Verify public source marker
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          MARKER_URL="${PUBLIC_URL}source-sha.txt"
          for attempt in $(seq 1 30); do
            ACTUAL="$(curl -fsS "${MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$ACTUAL" == "$SOURCE_SHA" ]]; then
              echo "Public marker matches $SOURCE_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "Public marker did not converge to $SOURCE_SHA" >&2
          exit 1

      - name: Verify public Arc and Spiral ready state in headless Chrome
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_BIN" ]]; then
            echo "No Chrome/Chromium binary is available on the runner" >&2
            exit 1
          fi

          PAGE_URL="${PUBLIC_URL}?source=${SOURCE_SHA}"
          LAST_DOM=""
          LAST_STDERR=""

          for attempt in $(seq 1 5); do
            STDERR_FILE="$RUNNER_TEMP/moves-awful-chrome-${attempt}.stderr"
            DOM="$($CHROME_BIN --headless --disable-gpu --no-sandbox --virtual-time-budget=10000 --dump-dom "${PAGE_URL}&attempt=${attempt}" 2>"$STDERR_FILE" || true)"
            ARC_READY=0
            SPIRAL_READY=0

            if grep -Eq '<canvas[^>]*(id="arc"[^>]*data-gallery-state="ready"|data-gallery-state="ready"[^>]*id="arc")' <<<"$DOM"; then
              ARC_READY=1
            fi
            if grep -Eq '<canvas[^>]*(id="spiral"[^>]*data-gallery-state="ready"|data-gallery-state="ready"[^>]*id="spiral")' <<<"$DOM"; then
              SPIRAL_READY=1
            fi

            if [[ "$ARC_READY" == 1 && "$SPIRAL_READY" == 1 ]]; then
              echo "Public Arc and Spiral both reached data-gallery-state=ready"
              exit 0
            fi

            echo "Attempt ${attempt}: Arc ready=${ARC_READY}, Spiral ready=${SPIRAL_READY}"
            echo "Serialized Canvas tags:"
            grep -oE '<canvas[^>]*>' <<<"$DOM" || true

            LAST_DOM="$DOM"
            LAST_STDERR="$(cat "$STDERR_FILE" 2>/dev/null || true)"
            sleep 2
          done

          echo "Public Canvas smoke did not observe ready state for both Arc and Spiral" >&2
          echo "Final serialized Canvas tags:" >&2
          grep -oE '<canvas[^>]*>' <<<"$LAST_DOM" >&2 || true
          echo "Final Chrome stderr (last 80 lines):" >&2
          tail -n 80 <<<"$LAST_STDERR" >&2 || true
          exit 1
