name: pr37-fix-pending-react-mounts

on:
  push:
    branches: [feat/react-adapter-7]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/react-adapter-7
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply synchronous pending-mount cancellation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          arc = Path("canvas-animations/arc.ts")
          text = arc.read_text()
          marker = "const beginMount = (key: string): symbol => {"
          if "export const disposeArcCanvas" not in text:
              insert = (
                  "export const disposeArcCanvas = (canvas: HTMLCanvasElement): void => {\n"
                  "  const key = arcElementKeys.get(canvas);\n"
                  "  if (!key) return;\n"
                  "  pendingMounts.delete(key);\n"
                  "  disposeCanvasAnimation(key);\n"
                  "};\n\n"
              )
              if text.count(marker) != 1:
                  raise SystemExit("arc.ts: beginMount marker missing or ambiguous")
              arc.write_text(text.replace(marker, insert + marker, 1))

          spiral = Path("canvas-animations/spiral.ts")
          text = spiral.read_text()
          marker = "const beginMount = (key: string): symbol => {"
          if "export const disposeSpiralCanvas" not in text:
              insert = (
                  "export const disposeSpiralCanvas = (canvas: HTMLCanvasElement): void => {\n"
                  "  const key = spiralElementKeys.get(canvas);\n"
                  "  if (!key) return;\n"
                  "  pendingMounts.delete(key);\n"
                  "  disposeCanvasAnimation(key);\n"
                  "};\n\n"
              )
              if text.count(marker) != 1:
                  raise SystemExit("spiral.ts: beginMount marker missing or ambiguous")
              spiral.write_text(text.replace(marker, insert + marker, 1))

          react = Path("react/index.ts")
          text = react.read_text()
          text = text.replace(
              'import { mountArcCanvas } from "../canvas-animations/arc.ts";',
              'import { disposeArcCanvas, mountArcCanvas } from "../canvas-animations/arc.ts";',
              1,
          )
          text = text.replace(
              'import { mountSpiralCanvas } from "../canvas-animations/spiral.ts";',
              'import { disposeSpiralCanvas, mountSpiralCanvas } from "../canvas-animations/spiral.ts";',
              1,
          )
          old = '      const mount = variant === "arc" ? mountArcCanvas : mountSpiralCanvas;\n'
          new = (
              old
              + '      const disposeCanvas = variant === "arc" ? disposeArcCanvas : disposeSpiralCanvas;\n'
          )
          if "const disposeCanvas = variant ===" not in text:
              if text.count(old) != 1:
                  raise SystemExit("react/index.ts: mount selector marker missing or ambiguous")
              text = text.replace(old, new, 1)
          old = "        cleaned = true;\n        dispose();"
          new = "        cleaned = true;\n        disposeCanvas(canvas);\n        dispose();"
          if "disposeCanvas(canvas);" not in text:
              if text.count(old) != 1:
                  raise SystemExit("react/index.ts: cleanup marker missing or ambiguous")
              text = text.replace(old, new, 1)
          react.write_text(text)
          PY
      - name: Remove one-shot workflow before repository policy checks
        run: rm .github/workflows/pr37-fix-pending-react-mounts.yml
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "moves-awful automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: cancel pending React canvas mounts"
          git push origin HEAD:feat/react-adapter-7
