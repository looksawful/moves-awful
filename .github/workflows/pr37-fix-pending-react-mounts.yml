name: pr37-fix-pending-react-mounts

on:
  push:
    branches: [feat/react-adapter-7]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/react-adapter-7
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply synchronous pending-mount cancellation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "canvas-animations/arc.ts",
              '''const getArcElementAnimationKey = (canvas: HTMLCanvasElement): string => {
            const existing = arcElementKeys.get(canvas);
            if (existing) return existing;
            const key = `${ARC_KEY_PREFIX}element-${nextArcElementKey++}`;
            arcElementKeys.set(canvas, key);
            return key;
          };
          ''',
              '''const getArcElementAnimationKey = (canvas: HTMLCanvasElement): string => {
            const existing = arcElementKeys.get(canvas);
            if (existing) return existing;
            const key = `${ARC_KEY_PREFIX}element-${nextArcElementKey++}`;
            arcElementKeys.set(canvas, key);
            return key;
          };

          export const disposeArcCanvas = (canvas: HTMLCanvasElement): void => {
            const key = arcElementKeys.get(canvas);
            if (!key) return;
            pendingMounts.delete(key);
            disposeCanvasAnimation(key);
          };
          ''',
          )

          replace_once(
              "canvas-animations/spiral.ts",
              '''const getSpiralElementAnimationKey = (canvas: HTMLCanvasElement): string => {
            const existing = spiralElementKeys.get(canvas);
            if (existing) return existing;
            const key = `${SPIRAL_KEY_PREFIX}element-${nextSpiralElementKey++}`;
            spiralElementKeys.set(canvas, key);
            return key;
          };
          ''',
              '''const getSpiralElementAnimationKey = (canvas: HTMLCanvasElement): string => {
            const existing = spiralElementKeys.get(canvas);
            if (existing) return existing;
            const key = `${SPIRAL_KEY_PREFIX}element-${nextSpiralElementKey++}`;
            spiralElementKeys.set(canvas, key);
            return key;
          };

          export const disposeSpiralCanvas = (canvas: HTMLCanvasElement): void => {
            const key = spiralElementKeys.get(canvas);
            if (!key) return;
            pendingMounts.delete(key);
            disposeCanvasAnimation(key);
          };
          ''',
          )

          replace_once(
              "react/index.ts",
              'import { mountArcCanvas } from "../canvas-animations/arc.ts";\nimport { mountSpiralCanvas } from "../canvas-animations/spiral.ts";',
              'import { disposeArcCanvas, mountArcCanvas } from "../canvas-animations/arc.ts";\nimport { disposeSpiralCanvas, mountSpiralCanvas } from "../canvas-animations/spiral.ts";',
          )

          replace_once(
              "react/index.ts",
              '''      const mount = variant === "arc" ? mountArcCanvas : mountSpiralCanvas;

              void mount(canvas, { items, maxDpr }).then((nextDispose) => {
          ''',
              '''      const mount = variant === "arc" ? mountArcCanvas : mountSpiralCanvas;
              const disposeCanvas = variant === "arc" ? disposeArcCanvas : disposeSpiralCanvas;

              void mount(canvas, { items, maxDpr }).then((nextDispose) => {
          ''',
          )

          replace_once(
              "react/index.ts",
              '''      return () => {
                cleaned = true;
                dispose();
              };
          ''',
              '''      return () => {
                cleaned = true;
                disposeCanvas(canvas);
                dispose();
              };
          ''',
          )
          PY
      - name: Remove one-shot workflow before repository policy checks
        run: rm .github/workflows/pr37-fix-pending-react-mounts.yml
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "moves-awful automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: cancel pending React canvas mounts"
          git push origin HEAD:feat/react-adapter-7
