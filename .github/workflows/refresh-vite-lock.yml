name: Refresh Vite lock

on:
  push:
    branches: [temp-dependency-refresh]
    paths:
      - .github/workflows/refresh-vite-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: temp-dependency-refresh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Refresh Vite and lockfile
        run: npm install --save-dev vite@8.2.2

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify
        run: |
          npm run check
          npm test
          npm run build

      - name: Commit refreshed dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "chore: update Vite to 8.2.2"
          git push origin HEAD:temp-dependency-refresh
