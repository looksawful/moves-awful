name: arc-font-boundary-fix-once

on:
  push:
    branches: [fix/arc-font-load-boundary]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/arc-font-load-boundary
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove host-font blocking from Arc mount
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('canvas-animations/arc.js')
          text = path.read_text()

          font_loader = '''const loadTitleFont = async ({ fontFamily, fontWeight }) => {\n  const fonts = globalThis.document?.fonts;\n\n  if (!fonts?.load) {\n    return;\n  }\n\n  try {\n    await fonts.load(`${fontWeight} 16px ${fontFamily}`);\n  } catch (error) {\n    console.warn("Arc font load failed, using fallback font.", error);\n  }\n};\n\n'''
          if text.count(font_loader) != 1:
              raise SystemExit('expected exactly one loadTitleFont implementation')
          text = text.replace(font_loader, '', 1)

          wait = '  await loadTitleFont(titleStyle);\n\n'
          if text.count(wait) != 1:
              raise SystemExit('expected exactly one blocking font wait')
          text = text.replace(wait, '', 1)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow before repository checks
        run: rm .github/workflows/arc-font-boundary-fix-once.yml
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "moves-awful automation"
          git config user.email "actions@users.noreply.github.com"
          git add canvas-animations/arc.js .github/workflows/arc-font-boundary-fix-once.yml
          git commit -m "fix: decouple Arc mount from host font loading"
          git push origin HEAD:fix/arc-font-load-boundary
