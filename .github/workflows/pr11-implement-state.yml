name: pr11-implement-state

on:
  push:
    branches: [temp-dependency-refresh]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: temp-dependency-refresh
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply gallery state implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, marker, replacement):
              p = Path(path)
              text = p.read_text()
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}")
              p.write_text(text.replace(marker, replacement, 1))

          patch(
              "canvas-animations/arc.js",
              '  const mountToken = beginMount(key);\n  const titleStyle = getTitleStyle(canvas);',
              '  const mountToken = beginMount(key);\n  canvas.dataset.galleryState = "loading";\n  const titleStyle = getTitleStyle(canvas);',
          )
          patch(
              "canvas-animations/arc.js",
              '  if (!isCurrentMount(key, mountToken)) {\n    return noop;\n  }\n\n  const dispose = createCanvasAnimation({',
              '  if (!isCurrentMount(key, mountToken)) {\n    return noop;\n  }\n\n  const hasRenderableItems = items.some((item) => Boolean(item.imageElement));\n  canvas.dataset.galleryState = hasRenderableItems ? "ready" : "error";\n\n  if (!hasRenderableItems) {\n    pendingMounts.delete(key);\n    return noop;\n  }\n\n  const dispose = createCanvasAnimation({',
          )
          patch(
              "canvas-animations/spiral.js",
              '  const mountToken = beginMount(key);\n  const sourceItems = Array.isArray(options.items) ? normalizeItems(options.items) : spiralCoverUrls;',
              '  const mountToken = beginMount(key);\n  canvas.dataset.galleryState = "loading";\n  const sourceItems = Array.isArray(options.items) ? normalizeItems(options.items) : spiralCoverUrls;',
          )
          patch(
              "canvas-animations/spiral.js",
              '  if (!isCurrentMount(key, mountToken)) {\n    return noop;\n  }\n\n  const dispose = createCanvasAnimation({',
              '  if (!isCurrentMount(key, mountToken)) {\n    return noop;\n  }\n\n  const hasRenderableImages = images.some((item) => Boolean(item.imageElement));\n  canvas.dataset.galleryState = hasRenderableImages ? "ready" : "error";\n\n  if (!hasRenderableImages) {\n    pendingMounts.delete(key);\n    return noop;\n  }\n\n  const dispose = createCanvasAnimation({',
          )
          PY
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit implementation and remove one-shot runner
        run: |
          rm .github/workflows/pr11-implement-state.yml
          git config user.name "moves-awful automation"
          git config user.email "actions@users.noreply.github.com"
          git add canvas-animations/arc.js canvas-animations/spiral.js .github/workflows/pr11-implement-state.yml
          git commit -m "feat: expose canvas gallery state"
          git push origin HEAD:temp-dependency-refresh
