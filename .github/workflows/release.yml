name: image-readiness-fix

on:
  push:
    branches: [fix/image-decode-readiness-2026-09-16]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/image-decode-readiness-2026-09-16
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stop blocking readiness on decode
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '''    image.onload = async () => {
                try {
                  await image.decode?.();
                } catch {
                  // Cached or animated images can still be drawable after decode rejection.
                }
                resolve(image);
              };'''
          new = '''    image.onload = () => {
                // `load` already means the image is drawable. `decode()` is optional
                // optimization work and must never block gallery readiness.
                resolve(image);
              };'''

          for filename in ("canvas-animations/arc.ts", "canvas-animations/spiral.ts"):
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected loader block not found in {filename}")
              path.write_text(text.replace(old, new, 1))
          PY
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/release.yml
          git config user.name "moves-awful automation"
          git config user.email "actions@users.noreply.github.com"
          git add canvas-animations/arc.ts canvas-animations/spiral.ts .github/workflows/release.yml
          git commit -m "fix: resolve image readiness on load"
          git push origin HEAD:fix/image-decode-readiness-2026-09-16
